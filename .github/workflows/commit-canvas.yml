name: Generate Commit Canvas

on:
  schedule:
    - cron: "17 15 * * *"   # 매일 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw canvas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/generate.py --user ${{ github.repository_owner }} --out dist/commit-canvas.svg --theme light
          python src/generate.py --user ${{ github.repository_owner }} --out dist/commit-canvas-dark.svg --theme dark
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-canvas.svg commit-canvas-dark.svg
          git commit -q -m "Update commit canvas"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
