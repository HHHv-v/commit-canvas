<rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#1F1F2A"/>
<rect x="56" y="48" width="28" height="28" rx="8" fill="url(#logo)"/>
<text x="96" y="69" font-size="19" font-weight="700" fill="#F5F5FA">Commit Canvas</text>
<text x="56" y="160" font-size="54" font-weight="800" letter-spacing="-1.6" fill="#F5F5FA">내 1년의 GitHub 기여가</text>
