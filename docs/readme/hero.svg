  <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF5C93"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#FF5C93" stop-opacity=".22"/><stop offset="1" stop-color="#FF5C93" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="1200" height="320" rx="24"/></clipPath>
  <style>text{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}</style>
